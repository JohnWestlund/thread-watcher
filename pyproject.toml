[project]
name = "reddit-monitor-mcp"
version = "0.1.0"
description = "Read-only MCP server that watches your Reddit posts and triages new comments for reply drafting"
requires-python = ">=3.10"
dependencies = ["praw>=7.7", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reddit-monitor-mcp = "reddit_monitor.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
